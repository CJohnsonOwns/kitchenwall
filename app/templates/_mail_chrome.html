<div class="toast" id="toast" role="status" aria-live="polite" hidden>
  <span id="toast-text"></span>
  <button type="button" class="ghost" id="toast-undo" hidden>Undo</button>
</div>

<dialog id="kbd-help" class="compose-dialog kbd-help" aria-labelledby="kbd-help-title">
  <div class="cat-manager-head"><h2 id="kbd-help-title">Keyboard shortcuts</h2><form method="dialog"><button type="submit" class="ghost" aria-label="Close">✕</button></form></div>
  <div class="kbd-grid">
    <div><h3>List</h3>
      <dl>
        <dt><kbd>j</kbd> <kbd>k</kbd></dt><dd>Next / previous conversation</dd>
        <dt><kbd>Enter</kbd> <kbd>o</kbd></dt><dd>Open</dd>
        <dt><kbd>x</kbd></dt><dd>Select</dd>
        <dt><kbd>/</kbd></dt><dd>Search</dd>
        <dt><kbd>c</kbd></dt><dd>New message</dd>
      </dl>
    </div>
    <div><h3>Conversation</h3>
      <dl>
        <dt><kbd>e</kbd></dt><dd>Archive</dd>
        <dt><kbd>#</kbd></dt><dd>Delete</dd>
        <dt><kbd>s</kbd></dt><dd>Star</dd>
        <dt><kbd>Shift</kbd>+<kbd>I</kbd> / <kbd>U</kbd></dt><dd>Mark read / unread</dd>
        <dt><kbd>r</kbd> <kbd>a</kbd> <kbd>f</kbd></dt><dd>Reply, reply all, forward</dd>
        <dt><kbd>u</kbd></dt><dd>Back to the list</dd>
      </dl>
    </div>
  </div>
</dialog>
