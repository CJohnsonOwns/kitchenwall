<!doctype html>
<html lang="en">
<head>
  {% include "_head.html" %}
  <title>Choose a password — Kitchenwall</title>
</head>
<body>
  <main class="login-wrap">
    <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 100 100"><path d="M50 22 L80 47 L72 47 L72 78 L55 78 L55 60 L45 60 L45 78 L28 78 L28 47 L20 47 Z" fill="#1a1305"/></svg></span>
    <h1>Hi, {{ me.display_name }}</h1>
    <p class="hint">You signed in with a temporary password. Choose your own to continue (at least 10 characters).</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="/password" class="login-form">
      <input type="text" name="username" value="{{ me.username }}" autocomplete="username" hidden>
      <label for="new" class="sr-only">New password</label>
      <input type="password" id="new" name="new" placeholder="New password" minlength="10" required autofocus autocomplete="new-password">
      <label for="again" class="sr-only">New password again</label>
      <input type="password" id="again" name="again" placeholder="New password again" minlength="10" required autocomplete="new-password">
      <button type="submit">Save and continue</button>
    </form>
    <form method="post" action="/logout" class="login-form"><button type="submit" class="subtle">Log out</button></form>
  </main>
</body>
</html>
